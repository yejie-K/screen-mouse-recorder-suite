name: CI

on:
  push:
    branches: ["main", "dev/**"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Critical lint
        run: ruff check src tests --select E9,F63,F7,F82
      - name: Test
        run: python -m pytest -q
